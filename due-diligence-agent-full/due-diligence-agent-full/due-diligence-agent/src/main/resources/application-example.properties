spring.application.name=due-diligence-agent

spring.datasource.url=jdbc:postgresql://localhost:5432/realestate
spring.datasource.username=postgres
spring.datasource.password=YOUR_DATABASE_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

nominatim.base-url=https://nominatim.openstreetmap.org
# Milestone 2 External Service Configurations
shovels.base-url=https://api.shovels.ai/v1
shovels.api-key=${SHOVELS_API_KEY:YOUR_SHOVELS_API_KEY}

fema.nfhl.base-url=${FEMA_NFHL_BASE_URL:https://hazards.fema.gov/gis/nfhl/rest/services/public/NFHL/MapServer}

elevation.base-url=https://epqs.nationalmap.gov/v1/json

epa.envirofacts.base-url=${EPA_ENVIROFACTS_BASE_URL:https://data.epa.gov/efservice}